name: Build Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o socks5-pool .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: socks5-pool-linux-amd64
          path: socks5-pool
